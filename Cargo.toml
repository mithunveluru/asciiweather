[package]
name = "asciiweather"
version = "0.1.0"
edition = "2024"
description = "Weather, rendered by your terminal — real conditions as procedural ASCII art."
license = "MIT"
readme = "README.md"
repository = "https://github.com/mithunveluru/asciiweather"
homepage = "https://github.com/mithunveluru/asciiweather"
keywords = ["weather", "cli", "ascii", "terminal", "art"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
ureq = { version = "3.4.0", default-features = false, features = ["rustls", "json"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
